<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishik Das | Portfolio</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --border-color: #eaeaea;
            --text-color: #666666;
            --text-heading: #111111;
            --primary-color: #000000; 
            --tab-inactive: transparent;
            --navbar-bg: rgba(255, 255, 255, 0.8);
            --monospace-font: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
        }
        
        html.dark-theme-override, .dark-theme-override {
            --bg-color: #111111;
            --card-bg: #111111;
            --border-color: #222222;
            --text-color: #888888;
            --text-heading: #ffffff;
            --primary-color: #ffffff;
            --navbar-bg: rgba(17, 17, 17, 0.8);
        }
        
        * { box-sizing: border-box; letter-spacing: -0.01em; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        
        .navbar-wrapper {
            position: sticky;
            top: 0;
            width: 100%;
            background-color: var(--navbar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }
        
        .navbar {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .nav-links { 
            display: flex; 
            align-items: center; 
            gap: 4px;
            flex-wrap: wrap;
        }
        
        .nav-brand {
            font-family: var(--monospace-font);
            font-weight: 600;
            color: var(--text-heading);
            margin-right: 24px;
            font-size: 13px;
        }
        
        .tab-btn, .theme-toggle-btn {
            background-color: var(--tab-inactive);
            color: var(--text-color);
            padding: 6px 12px;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.15s ease;
        }
        
        .theme-toggle-btn { 
            font-family: var(--monospace-font); 
            font-size: 12px; 
        }
        
        .tab-btn:hover, .theme-toggle-btn:hover { 
            color: var(--text-heading); 
        }
        
        .tab-btn.active, .dropdown-wrapper.active .dropdown-trigger {
            background-color: var(--border-color);
            color: var(--text-heading);
            font-weight: 600;
        }
        
        .dropdown-wrapper {
            position: relative;
            display: inline-flex !important; 
            align-items: center;
        }
        
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 0;
            min-width: 160px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            margin-top: 4px;
        }
        
        .dropdown-wrapper:hover .dropdown-menu, .dropdown-wrapper.open .dropdown-menu {
            display: block !important;
        }
        
        .dropdown-menu button {
            width: 100%;
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: var(--text-color);
            text-align: left;
            font-size: 13px;
            font-family: var(--monospace-font);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        
        .dropdown-menu button:hover {
            background-color: var(--border-color);
            color: var(--text-heading);
        }
        
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 60px 24px; 
        }
        
        .hero-section { 
            margin-bottom: 48px; 
            padding-bottom: 40px; 
            border-bottom: 1px solid var(--border-color); 
        }
        
        .hero-grid { 
            display: grid; 
            grid-template-columns: 1fr 160px; 
            align-items: center; 
            gap: 40px; 
        }
        
        @media (max-width: 650px) {
            .hero-grid { 
                grid-template-columns: 1fr; 
                text-align: center; 
                justify-items: center; 
                gap: 32px; 
            }
        }
        
        .hero-text { width: 100%; }
        
        .hero-header-tag {
            font-family: var(--monospace-font);
            font-size: 13px;
            color: var(--text-color);
            margin-bottom: 12px;
        }
        
        .hero-section h1 { 
            font-size: 2.8rem; 
            font-weight: 700; 
            color: var(--text-heading); 
            margin: 0 0 16px 0; 
            letter-spacing: -0.04em; 
            line-height: 1.1; 
        }
        
        .subheading { 
            font-size: 1.1rem; 
            line-height: 1.6; 
            max-width: 720px; 
            margin: 0 0 24px 0; 
            color: var(--text-color); 
        }
        
        .contact-row { 
            font-size: 13px; 
            font-family: var(--monospace-font); 
        }
        
        .location-tag { 
            color: var(--text-heading); 
            font-weight: 600; 
        }
        
        .profile-avatar-container {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .radar-ring {
            position: absolute;
            width: 156px;
            height: 156px;
            border: 1px dashed var(--text-color);
            border-radius: 50%;
            opacity: 0.4;
            animation: spinRing 20s linear infinite;
        }
        
        .profile-image-wrapper {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            background-color: var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        
        .profile-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .main-layout { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 48px; 
        }
        
        h2 { 
            font-size: 1.1rem; 
            font-weight: 600; 
            color: var(--text-heading); 
            margin-top: 0; 
            margin-bottom: 24px; 
            font-family: var(--monospace-font); 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
        }
        
        .form-card { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            padding: 24px; 
        }
        
        .form-group { 
            margin-bottom: 20px; 
        }
        
        label { 
            display: block; 
            font-family: var(--monospace-font); 
            font-size: 11px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            margin-bottom: 8px; 
            color: var(--text-heading); 
        }
        
        input[type="text"], textarea, select { 
            width: 100%; 
            padding: 10px 14px; 
            background-color: var(--bg-color); 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            font-size: 14px; 
            color: var(--text-color); 
            font-family: inherit; 
        }
        
        input[type="text"]:focus, textarea:focus, select:focus { 
            outline: none; 
            border-color: var(--text-color); 
        }
        
        .category-notice { 
            font-family: var(--monospace-font); 
            font-size: 12px; 
            color: var(--text-heading); 
            background-color: var(--bg-color); 
            border: 1px solid var(--border-color); 
            padding: 10px; 
            border-radius: 6px; 
            margin-bottom: 20px; 
        }
        
        .submit-btn { 
            width: 100%; 
            background-color: var(--primary-color); 
            color: var(--bg-color); 
            border: 1px solid var(--primary-color); 
            padding: 12px; 
            font-size: 14px; 
            font-weight: 600; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: opacity 0.2s ease; 
        }
        
        .submit-btn:hover { opacity: 0.9; }
        
        .achievements-list { 
            display: flex; 
            flex-direction: column; 
            gap: 0; 
            border-top: 1px solid var(--border-color); 
        }
        
        .achievement-card { 
            background-color: var(--card-bg); 
            border-bottom: 1px solid var(--border-color); 
            padding: 24px 0; 
            position: relative; 
        }
        
        .achievement-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: baseline; 
            margin-bottom: 8px; 
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .achievement-category { 
            font-family: var(--monospace-font); 
            font-size: 11px; 
            font-weight: 600; 
            text-transform: uppercase; 
            color: var(--text-color); 
        }
        
        .achievement-subcategory { 
            font-family: var(--monospace-font); 
            font-size: 11px; 
            color: var(--text-heading); 
            margin-left: 8px; 
            background: var(--border-color); 
            padding: 2px 6px; 
            border-radius: 4px; 
            text-transform: uppercase; 
        }
        
        .achievement-date { 
            font-family: var(--monospace-font); 
            font-size: 12px; 
            color: var(--text-color); 
        }
        
        .achievement-title { 
            font-size: 1.15rem; 
            font-weight: 600; 
            color: var(--text-heading); 
            margin: 0 0 8px 0; 
        }
        
        .achievement-desc { 
            font-size: 14px; 
            line-height: 1.6; 
            margin: 0 0 16px 0; 
            color: var(--text-color); 
        }
        
        .delete-btn { 
            background-color: transparent; 
            color: #cc0000; 
            border: none; 
            font-family: var(--monospace-font); 
            font-size: 11px; 
            font-weight: 600; 
            padding: 0; 
            cursor: pointer; 
            text-transform: uppercase; 
            display: inline-block; 
            margin-top: 4px; 
        }
        
        .delete-btn:hover { text-decoration: underline; }
        
        .empty-state { 
            text-align: center; 
            padding: 48px 0; 
            font-family: var(--monospace-font); 
            font-size: 13px; 
            color: var(--text-color); 
        }
        
        .admin-only {
            display: none !important;
        }
        
        .admin-user .admin-only {
            display: block !important;
        }
        
        .admin-user .delete-btn {
            display: inline-block !important;
        }
        
        .public-user .delete-btn {
            display: none !important;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            font-family: var(--monospace-font);
            margin-top: 8px;
        }
        
        .status-online {
            background: #e6f7e6;
            color: #1a7a1a;
        }
        
        .status-offline {
            background: #fde8e8;
            color: #cc0000;
        }
        
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            
            .nav-links {
                justify-content: center;
            }
            
            .theme-toggle-btn {
                align-self: center;
            }
        }
    </style>
</head>
<body>
    <div class="navbar-wrapper">
        <div class="navbar">
            <div class="nav-links">
                <span class="nav-brand">Portfolio</span>
                <button class="tab-btn active" onclick="switchTab('all')">All</button>
                <button class="tab-btn" onclick="switchTab('school')">School</button>
                
                <div class="dropdown-wrapper">
                    <button class="tab-btn dropdown-trigger" onclick="toggleDropdownMenu(event)">Robotics ▾</button>
                    <div id="roboticsDropdown" class="dropdown-menu">
                        <button onclick="switchTab('robotics')">Overview</button>
                        <button onclick="switchTab('fll')">FLL</button>
                        <button onclick="switchTab('arduino')">Arduino</button>
                        <button onclick="switchTab('raspberry pi')">Raspberry Pi</button>
                    </div>
                </div>

                <button class="tab-btn" onclick="switchTab('science projects')">Science Projects</button>
                <button class="tab-btn" onclick="switchTab('coding')">Coding</button>
            </div>
            <button class="theme-toggle-btn" onclick="toggleThemeManual()">🌓 Dark mode</button>
        </div>
    </div>
    
    <div class="container">
        <header class="hero-section">
            <div class="hero-grid">
                <div class="hero-text">
                    <div class="hero-header-tag">Technical Portfolio</div>
                    <h1>Rishik Das</h1>
                    <div class="contact-row">
                        <span class="location-tag">Acton, MA, USA</span>
                    </div>
                    <div id="connectionStatus" class="status-badge status-offline">● Offline Mode</div>
                </div>
                <div class="profile-avatar-container">
                    <div class="radar-ring"></div>
                    <div class="profile-image-wrapper">
                        <img src="profile.jpeg" alt="Rishik Das" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'40\' fill=\'%23dddddd\'/></svg>'">
                    </div>
                </div>
            </div>
        </header>
        
        <main class="main-layout">
            <section id="formCard" class="form-card admin-only">
                <h2>Log Milestone</h2>
                <div id="categoryNotice" class="category-notice"></div>
                <form id="achievementForm">
                    <div class="form-group">
                        <label for="title">Project / Title</label>
                        <input type="text" id="title" placeholder="e.g., Autonomous Maze Navigation" required>
                    </div>
                    <div class="form-group" id="categoryGroup">
                        <label for="category">Stack / Category</label>
                        <select id="category" required>
                            <option value="school">School</option>
                            <option value="robotics">Robotics</option>
                            <option value="science projects">Science Projects</option>
                            <option value="coding">Coding</option>
                        </select>
                    </div>
                    <div class="form-group" id="subcategoryGroup" style="display: none;">
                        <label for="subcategory">Robotics Subcategory</label>
                        <select id="subcategory">
                            <option value="fll">FLL</option>
                            <option value="arduino">Arduino</option>
                            <option value="raspberry pi">Raspberry Pi</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Timeline</label>
                        <input type="text" id="date" placeholder="e.g., Jan 2026" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Technical Overview</label>
                        <textarea id="description" rows="4" placeholder="Describe system architecture, mechanisms, or codebase engineering..." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Publish Entry</button>
                </form>
            </section>
            
            <section class="feed-section">
                <h2>Achievements</h2>
                <div id="achievementsContainer" class="achievements-list"></div>
            </section>
        </main>
        
        <footer style="margin-top: 80px; padding-top: 20px; border-top: 1px solid var(--border-color); text-align: center;">
            <button id="adminPortalBtn" class="theme-toggle-btn" style="font-size: 11px; opacity: 0.6;">🔒 Admin Login</button>
        </footer>
    </div>

    <script>
        // ===== CONFIGURATION =====
        const GITHUB_USER = 'rishikd15';
        const GITHUB_REPO = 'Portfolio';
        const MASTER_ADMIN_KEY = 'carrotie';
        const STORAGE_KEY = 'portfolio_data';
        const ADMIN_STORAGE_KEY = 'portfolio_admin_active';
        const TOKEN_STORAGE_KEY = 'github_token';
        
        // ===== STATE =====
        let achievements = [];
        let currentTab = 'all';
        let currentTheme = 'light';
        let gitHubToken = '';
        let isAdmin = false;
        let isOnline = false;
        
        // ===== DOM REFS =====
        const form = document.getElementById('achievementForm');
        const container = document.getElementById('achievementsContainer');
        const formCard = document.getElementById('formCard');
        const categoryNotice = document.getElementById('categoryNotice');
        const categorySelect = document.getElementById('category');
        const subcategoryGroup = document.getElementById('subcategoryGroup');
        const subcategorySelect = document.getElementById('subcategory');
        const adminPortalBtn = document.getElementById('adminPortalBtn');
        const statusBadge = document.getElementById('connectionStatus');
        
        // ===== LOCAL STORAGE =====
        function saveToLocalStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(achievements));
                return true;
            } catch (e) {
                console.warn('Could not save to localStorage:', e);
                return false;
            }
        }
        
        function loadFromLocalStorage() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    achievements = JSON.parse(data);
                    return true;
                }
            } catch (e) {
                console.warn('Could not load from localStorage:', e);
            }
            return false;
        }
        
        // ===== GITHUB OPERATIONS =====
        async function loadFromGitHub() {
            try {
                const response = await fetch(./achievements.json?t=${Date.now()});
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data) && data.length > 0) {
                        achievements = data;
                        saveToLocalStorage();
                        return true;
                    }
                }
            } catch (error) {
                console.warn('Could not fetch achievements.json:', error);
            }
            return false;
        }
        
        async function saveToGitHub() {
            if (!gitHubToken) {
                console.warn('No GitHub token provided. Changes saved locally only.');
                showStatus('offline', '● Offline Mode (Local Only)');
                return false;
            }
            
            try {
                const apiUrl = https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/achievements.json;
                
                // Get current file SHA
                const getRes = await fetch(${apiUrl}?t=${Date.now()}, {
                    method: 'GET',
                    headers: {
                        'Authorization': token ${gitHubToken},
                        'Accept': 'application/vnd.github.v3+json',
                        'Cache-Control': 'no-cache'
                    }
                });
                
                let sha = null;
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                } else if (getRes.status !== 404) {
                    throw new Error(GitHub API error: ${getRes.status});
                }
                
                // Prepare content
                const content = JSON.stringify(achievements, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(content)));
                
                // Upload to GitHub
                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': token ${gitHubToken},
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: 'Update achievements via portfolio',
                        content: encodedContent,
                        sha: sha || undefined
                    })
                });
                
                if (putRes.ok) {
                    showStatus('online', '● Cloud Sync Active');
                    return true;
                } else {
                    const errorData = await putRes.json();
                    console.error('GitHub save error:', errorData);
                    throw new Error(Failed to save: ${putRes.status});
                }
            } catch (error) {
                console.error('GitHub save error:', error);
                showStatus('offline', '● Offline Mode (Sync Failed)');
                return false;
            }
        }
        
        // ===== STATUS DISPLAY =====
        function showStatus(type, text) {
            isOnline = (type === 'online');
            statusBadge.className = status-badge ${type === 'online' ? 'status-online' : 'status-offline'};
            statusBadge.textContent = text;
        }
        
        // ===== LOAD DATA =====
        async function loadAchievements() {
            // Try GitHub first
            const loaded = await loadFromGitHub();
            
            if (!loaded) {
                // Try localStorage
                const localLoaded = loadFromLocalStorage();
                
                if (!localLoaded) {
                    // Use default data
                    achievements = [
                        {
                            id: Date.now() + 1,
                            title: "FLL Innovation Project Award",
                            category: "robotics",
                            subcategory: "fll",
                            date: "Jan 2026",
                            description: "Engineered high-torque custom gear assemblies and written responsive sensors algorithms in SPIKE Prime to streamline autonomous cargo movement during field runs."
                        },
                        {
                            id: Date.now() + 2,
                            title: "Personal Portfolio Website",
                            category: "coding",
                            subcategory: "",
                            date: "Jul 2025",
                            description: "Built a fully responsive portfolio website using HTML, CSS, and JavaScript with GitHub Pages integration and dark mode support."
                        },
                        {
                            id: Date.now() + 3,
                            title: "Arduino Line Following Robot",
                            category: "robotics",
                            subcategory: "arduino",
                            date: "Mar 2025",
                            description: "Designed and programmed an autonomous line-following robot using Arduino Uno, IR sensors, and PID control algorithms."
                        },
                        {
                            id: Date.now() + 4,
                            title: "Solar System Model",
                            category: "science projects",
                            subcategory: "",
                            date: "Nov 2024",
                            description: "Created a 3D-printed scale model of the solar system with LED lighting and Arduino-controlled orbital rotation."
                        },
                        {
                            id: Date.now() + 5,
                            title: "School Science Fair Winner",
                            category: "school",
                            subcategory: "",
                            date: "May 2025",
                            description: "Won first place for a project demonstrating renewable energy harvesting using piezoelectric materials."
                        }
                    ];
                    saveToLocalStorage();
                }
            }
            
            renderAchievements();
            checkConnectionStatus();
        }
        
        function checkConnectionStatus() {
            if (gitHubToken && isAdmin) {
                showStatus('online', '● Cloud Sync Active');
            } else {
                showStatus('offline', '● Offline Mode');
            }
        }
        
        // ===== RENDER =====
        function renderAchievements() {
            if (!container) return;
            
            container.innerHTML = '';
            const filtered = currentTab === 'all' 
                ? achievements 
                : achievements.filter(item => 
                    item.category === currentTab || 
                    item.subcategory === currentTab ||
                    (item.category === 'robotics' && ['fll', 'arduino', 'raspberry pi'].includes(currentTab))
                );
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">No technical entries deployed to this stack view.</div>';
                return;
            }
            
            const isAdminUser = localStorage.getItem(ADMIN_STORAGE_KEY) === 'true';
            
            filtered.forEach(achievement => {
                const card = document.createElement('div');
                card.className = achievement-card ${achievement.category};
                
                const deleteButtonHtml = isAdminUser 
                    ? <button class="delete-btn" onclick="deleteAchievement(${achievement.id})">Decommission</button> 
                    : '';
                
                const subTagHtml = achievement.subcategory 
                    ? <span class="achievement-subcategory">${achievement.subcategory}</span> 
                    : '';
                
                card.innerHTML = `
                    <div class="achievement-header">
                        <div>
                            <span class="achievement-category">${achievement.category}</span>
                            ${subTagHtml}
                        </div>
                        <div class="achievement-date">${achievement.date}</div>
                    </div>
                    <h3 class="achievement-title">${achievement.title}</h3>
                    <p class="achievement-desc">${achievement.description}</p>
                    ${deleteButtonHtml}
                `;
                container.appendChild(card);
            });
        }
        
        // ===== TABS =====
        function updateFormContext() {
            if (currentTab === 'all') {
                document.getElementById('categoryGroup').style.display = 'block';
                categorySelect.required = true;
                categorySelect.value = 'school';
                categoryNotice.style.display = 'none';
                subcategoryGroup.style.display = 'none';
                subcategorySelect.required = false;
            } 
            else if (['robotics', 'fll', 'arduino', 'raspberry pi'].includes(currentTab)) {
                document.getElementById('categoryGroup').style.display = 'none';
                categorySelect.required = false;
                categoryNotice.style.display = 'block';
                subcategoryGroup.style.display = 'block';
                subcategorySelect.required = true;
                
                if (['fll', 'arduino', 'raspberry pi'].includes(currentTab)) {
                    categoryNotice.textContent = Targeting robotics context: ${currentTab.toUpperCase()};
                    subcategorySelect.value = currentTab;
                    subcategoryGroup.style.display = 'none';
                } else {
                    categoryNotice.textContent = Targeting pipeline stack: robotics;
                    subcategorySelect.value = 'fll';
                }
            } 
            else {
                document.getElementById('categoryGroup').style.display = 'none';
                subcategoryGroup.style.display = 'none';
                subcategorySelect.required = false;
                categoryNotice.style.display = 'block';
                categoryNotice.textContent = Targeting pipeline stack: ${currentTab.toLowerCase()};
                categorySelect.required = false;
            }
        }
        
        window.switchTab = function(tabName) {
            currentTab = tabName;
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            const dropdownWrapper = document.querySelector('.dropdown-wrapper');
            if (dropdownWrapper) dropdownWrapper.classList.remove('open');
            
            buttons.forEach(btn => {
                if(btn.textContent.toLowerCase().replace(' ▾', '') === tabName) {
                    btn.classList.add('active');
                }
            });
            
            if (['fll', 'arduino', 'raspberry pi', 'robotics'].includes(tabName) && dropdownWrapper) {
                dropdownWrapper.classList.add('active');
            }
            
            updateFormContext();
            renderAchievements();
        }
        
        window.toggleDropdownMenu = function(e) {
            e.stopPropagation();
            document.querySelector('.dropdown-wrapper').classList.toggle('open');
        };
        
        document.addEventListener('click', () => {
            const wrapper = document.querySelector('.dropdown-wrapper');
            if (wrapper) wrapper.classList.remove('open');
        });
        
        // ===== THEME =====
        function setTheme(mode) {
            currentTheme = mode;
            if (mode === 'dark') {
                document.documentElement.className = 'dark-theme-override';
            } else {
                document.documentElement.className = '';
            }
        }
        
        window.toggleThemeManual = function() {
            setTheme(currentTheme === 'light' ? 'dark' : 'light');
        };
        
        function matchSystemTheme() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme('dark');
            } else {
                setTheme('light');
            }
        }
        
        // ===== ADMIN =====
        function verifyDeviceIdentity() {
            isAdmin = localStorage.getItem(ADMIN_STORAGE_KEY) === 'true';
            gitHubToken = localStorage.getItem(TOKEN_STORAGE_KEY) || '';
            
            if (isAdmin) {
                document.body.className = 'admin-user';
                adminPortalBtn.textContent = '🔓 Log Out Admin';
                checkConnectionStatus();
            } else {
                document.body.className = 'public-user';
                adminPortalBtn.textContent = '🔒 Admin Login';
                gitHubToken = '';
                localStorage.removeItem(TOKEN_STORAGE_KEY);
                showStatus('offline', '● Offline Mode');
            }
        }
        
        if (adminPortalBtn) {
            adminPortalBtn.addEventListener('click', () => {
                if (isAdmin) {
                    localStorage.removeItem(ADMIN_STORAGE_KEY);
                    localStorage.removeItem(TOKEN_STORAGE_KEY);
                    isAdmin = false;
                    gitHubToken = '';
                    verifyDeviceIdentity();
                    renderAchievements();
                    alert('Logged out successfully.');
                } else {
                    const userInput = prompt("Enter Master Administrative Security Key:");
                    if (userInput === MASTER_ADMIN_KEY) {
                        const tokenInput = prompt("Enter your GitHub Personal Access Token to connect live cloud saving:");
                        if (tokenInput && tokenInput.trim()) {
                            gitHubToken = tokenInput.trim();
                            localStorage.setItem(ADMIN_STORAGE_KEY, 'true');
                            localStorage.setItem(TOKEN_STORAGE_KEY, gitHubToken);
                            isAdmin = true;
                            verifyDeviceIdentity();
                            renderAchievements();
                            
                            // Test connection
                            saveToGitHub().then(success => {
                                if (success) {
                                    alert('Authentication successful! Cloud sync is active.');
                                } else {
                                    alert('Authenticated but cloud sync failed. Check your token permissions.');
                                }
                            });
                        } else {
                            alert('Token required to manipulate database content. Authentication aborted.');
                        }
                    } else if (userInput !== null) {
                        alert('Invalid security authentication key signature.');
                    }
                }
            });
        }
        
        // ===== FORM =====
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            let category = categorySelect.value;
            if (['robotics', 'fll', 'arduino', 'raspberry pi'].includes(currentTab)) {
                category = 'robotics';
            } else if (currentTab !== 'all') {
                category = currentTab;
            }
            
            let subcategory = '';
            if (category === 'robotics') {
                subcategory = ['fll', 'arduino', 'raspberry pi'].includes(currentTab) ? currentTab : subcategorySelect.value;
            }
            
            const date = document.getElementById('date').value;
            const description = document.getElementById('description').value;
            
            const newAchievement = {
                id: Date.now(),
                title: title,
                category: category,
                subcategory: subcategory,
                date: date,
                description: description
            };
            
            achievements.push(newAchievement);
            saveToLocalStorage();
            
            // Try GitHub save
            saveToGitHub().then(success => {
                if (!success) {
                    console.log('Changes saved locally only.');
                }
            });
            
            renderAchievements();
            form.reset();
            if(category === 'robotics') {
                subcategoryGroup.style.display = 'block';
            }
            
            alert('Achievement added successfully!');
        });
        
        window.deleteAchievement = function(id) {
            if (!isAdmin) return;
            
            if (confirm('Are you sure you want to delete this achievement?')) {
                achievements = achievements.filter(item => item.id !== id);
                saveToLocalStorage();
                saveToGitHub().then(success => {
                    if (!success) {
                        console.log('Changes saved locally only.');
                    }
                });
                renderAchievements();
            }
        };
        
        // ===== INIT =====
        verifyDeviceIdentity();
        matchSystemTheme();
        loadAchievements();
        
        // Auto-save every 5 minutes
        setInterval(() => {
            if (isAdmin && gitHubToken) {
                saveToGitHub().catch(console.warn);
            }
        }, 300000);
        
        console.log('🚀 Portfolio loaded successfully!');
        console.log(📊 ${achievements.length} achievements loaded);
        console.log(isAdmin ? '🔓 Admin mode active' : '🔒 Public mode');
    </script>
</body>
</html>
